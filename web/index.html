<!DOCTYPE html>
<html lang="de">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="PLUs, Kassenpreise und Produktbarcodes schnell finden – offlinefähig und optional mit Supabase synchronisiert.">
  <meta name="theme-color" content="#CC071E">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="PLU Assistent">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>REWE PLU Assistent</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body {
      background: #f8f8f8;
      height: 100%;
      margin: 0;
    }

    .app-loading {
      align-items: center;
      color: #4a4a4a;
      display: flex;
      font: 600 16px system-ui, sans-serif;
      gap: 12px;
      inset: 0;
      justify-content: center;
      position: fixed;
    }

    .app-loading::before {
      animation: loading 0.8s linear infinite;
      border: 3px solid #e2b8bd;
      border-radius: 50%;
      border-top-color: #cc071e;
      content: "";
      height: 24px;
      width: 24px;
    }

    @keyframes loading { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="app-loading" id="app-loading">PLU Assistent wird geladen …</div>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
  <script>
    window.addEventListener('flutter-first-frame', () => {
      document.getElementById('app-loading')?.remove();
    });
  </script>
</body>
</html>
