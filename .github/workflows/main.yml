name: Gh-Pages

on:
  push:
    branches: [ master ]

permissions:
  contents: write

jobs:
  web-publish-build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v2 # Only works with v2
      - uses: subosito/flutter-action@v1
      - uses: spezian/flutter-gh-pages@main
        with:
          customArgs: --dart-define="SUPABASE_URL=${{secrets.SECRET_SB_URL}}" --dart-define="SUPABASE_PUBLISHABLE_KEY=${{secrets.SECRET_SB_PUBLISHABLE_KEY}}" --dart-define="UNSPLASH_ACCESS_KEY=${{secrets.SECRET_UN_ACCESS_KEY}}"
          site: kassenmeister.dacjan.eu
  android-release-build:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v2
      - uses: subosito/flutter-action@v1
      - uses: spezian/flutter-android-build-action@main
        id: android-build
        with:
          customArgs: --dart-define="SUPABASE_URL=${{secrets.SECRET_SB_URL}}" --dart-define="SUPABASE_PUBLISHABLE_KEY=${{secrets.SECRET_SB_PUBLISHABLE_KEY}}" --dart-define="UNSPLASH_ACCESS_KEY=${{secrets.SECRET_UN_ACCESS_KEY}}"
          release: true
      - name: Archive APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: ${{ steps.android-build.outputs.apk-path }}
